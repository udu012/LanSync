<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>LanSync · 局域网同步</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e8eaef; --text:#151a23; --muted:#78808f;
    --accent:#2563eb; --ok:#0ea371; --danger:#e5484d; --soft:#f0f2f6;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1116; --card:#161b22; --line:#232933; --text:#e6e9ef; --muted:#8b93a2;
           --soft:#1c222b; --shadow:0 1px 2px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px 10px;max-width:1080px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:16px;letter-spacing:.2px}
  .brand b{font-weight:650}
  .brand .muted{font-size:12.5px;color:var(--muted);margin-left:2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(14,163,113,.15)}
  .pill{
    font-size:12px;padding:4px 11px;border-radius:999px;color:var(--ok);
    background:rgba(14,163,113,.10);border:1px solid rgba(14,163,113,.22);
  }
  .pill.off{color:var(--danger);background:rgba(229,72,77,.10);border-color:rgba(229,72,77,.22)}

  main{
    max-width:1080px;margin:0 auto;padding:6px 22px 48px;
    display:grid;gap:16px;
    grid-template-columns:340px minmax(0,1fr);
    grid-template-areas:"con stat" "con up" "list list";
    align-items:start;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 20px;
  }
  .card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px;letter-spacing:.4px}
  .card.con{grid-area:con}
  .card.stat{grid-area:stat}
  .card.up{grid-area:up}
  .card.list{grid-area:list}

  .hint{font-size:12.5px;color:var(--muted);margin:-6px 0 14px}

  .qrwrap{
    width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;
    border:1px solid var(--line);background:#fff;padding:10px;
  }
  .qrwrap img{width:100%;height:100%;display:block;image-rendering:pixelated}
  .addr{display:flex;align-items:center;gap:8px;margin-top:12px}
  .addr code{
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:var(--soft);padding:8px 10px;border-radius:9px;color:var(--text);
  }
  .meta{margin-top:12px;display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--muted)}
  .meta div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .meta div>span{white-space:nowrap;flex:0 0 auto}
  .meta code{flex:1;min-width:0;text-align:right;color:var(--text);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  button{
    font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--text);
    transition:background .15s,border-color .15s,opacity .15s;
  }
  button:hover{background:var(--soft)}
  button.ghost{background:transparent;color:var(--muted)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--danger);border-color:rgba(229,72,77,.3)}
  button:disabled{opacity:.45;cursor:default}
  .addr button{padding:8px 12px}
  .ipsel{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .ipsel .lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.45}
  .ipbtns{display:flex;flex-wrap:wrap;gap:6px}
  .ipbtns button{padding:6px 10px;font-size:12px;border-radius:8px}
  .ipbtns button.on{background:var(--accent);color:#fff;border-color:transparent}
  .ipbtns button em{font-style:normal;opacity:.72;font-size:11px;margin-left:5px}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .grid3>div{background:var(--soft);border-radius:11px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .num{font-size:19px;font-weight:650;letter-spacing:-.3px}
  .lbl{font-size:11.5px;color:var(--muted)}
  .row{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
  .row code{flex:1;min-width:0;color:var(--text);opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini{padding:4px 11px;font-size:12px;border-radius:8px;flex:none;color:var(--muted);background:transparent}
  .mini:hover{color:var(--accent);border-color:var(--accent);background:rgba(37,99,235,.05)}
  .mini[disabled]{opacity:.5;cursor:default}

  /* 更换目录的确认弹层 */
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:22px}
  .modal[hidden]{display:none}
  .mbox{background:var(--card);border-radius:15px;padding:22px 22px 18px;width:100%;max-width:430px;
        box-shadow:0 18px 50px rgba(16,24,40,.22);animation:pop .16s ease-out}
  @keyframes pop{from{transform:translateY(8px) scale(.985);opacity:0}to{transform:none;opacity:1}}
  .mbox h3{margin:0 0 7px;font-size:15.5px;font-weight:600;letter-spacing:.1px}
  .mbox p{margin:0;font-size:13px;color:var(--muted);line-height:1.65}
  .mbox code{display:block;margin-top:11px;padding:9px 11px;background:var(--soft);border-radius:9px;
             font-size:12px;word-break:break-all;color:var(--text);line-height:1.5}
  .mbox code[hidden]{display:none}
  .mbox input{width:100%;margin-top:13px;padding:9px 11px;font:inherit;font-size:13px;
              border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}
  .mbox input:focus{outline:none;border-color:var(--accent)}
  .mbox input[hidden]{display:none}
  .mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .mbtns button{flex:none}
  .mbtns .primary{background:var(--accent);color:#fff;border-color:transparent}
  .mbtns .primary:hover{filter:brightness(1.06);background:var(--accent)}

  /* 操作结果提示 */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:60;
         background:#1b212b;color:#fff;font-size:12.8px;line-height:1.55;padding:10px 17px;
         border-radius:10px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;
         transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgba(16,24,40,.2)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (prefers-color-scheme: dark){
    /* 深色底上 0.42 的遮罩几乎看不出层次，弹层会和背景糊在一起 */
    .modal{background:rgba(0,0,0,.62)}
    .mbox{border:1px solid var(--line)}
    .toast{background:#2b3341}
  }
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

  .drop{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border:1.5px dashed var(--line);border-radius:12px;padding:26px 16px;cursor:pointer;
    color:var(--muted);transition:border-color .15s,background .15s;text-align:center;
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:rgba(37,99,235,.04);color:var(--accent)}
  .drop span:first-of-type{font-size:14px;color:var(--text)}
  .drop .sub{font-size:12px;color:var(--muted)}

  #queue{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  #queue li{display:grid;grid-template-columns:1fr 96px 46px;gap:10px;align-items:center;font-size:12.5px}
  #queue .bar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
  #queue .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #queue .pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  #queue .done i{background:var(--ok)}

  .lhead{display:flex;align-items:baseline;justify-content:space-between}
  .lhead h2{margin-bottom:12px}
  .lhead .muted{font-size:12px;color:var(--muted)}
  .frow{
    display:grid;grid-template-columns:34px minmax(0,1fr) 92px 110px 44px;
    gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);
  }
  .frow:first-child{border-top:none}
  .ext{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:9.5px;font-weight:700;letter-spacing:.3px;color:#fff;background:#94a3b8;
  }
  .fname{min-width:0}
  .fname b{display:block;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fname span{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fsize,.ftime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .del{background:none;border:none;color:var(--muted);padding:4px;font-size:12px;cursor:pointer}
  .del:hover{color:var(--danger);background:none}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:34px 0}

  @media (max-width:820px){
    main{grid-template-columns:1fr;grid-template-areas:"con" "stat" "up" "list";padding:4px 14px 40px}
    header{padding:14px 16px 8px}
    .card{padding:16px}
    .frow{grid-template-columns:30px minmax(0,1fr) 74px 40px;gap:9px}
    .ftime{display:none}
    .qrwrap{max-width:240px;margin:0 auto}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><b>LanSync</b><span class="muted">局域网同步</span></div>
  <span class="pill" id="status">正在启动…</span>
</header>

<main>
  <section class="card con">
    <h2>手机连接</h2>
    <p class="hint">手机连同一个 Wi-Fi，用相机扫码即可</p>
    <div class="qrwrap"><img id="qr" src="/qr.png" alt="配对二维码"></div>
    <div class="addr">
      <code id="url">…</code>
      <button id="copy">复制</button>
    </div>
    <div class="ipsel" id="ipsel" hidden>
      <span class="lbl">电脑有多个网络地址，扫码连不上就换一个</span>
      <div class="ipbtns" id="ipbtns"></div>
    </div>
    <div class="meta">
      <div><span>FolderSync 地址</span><code id="dav">…</code></div>
      <div><span>配对令牌</span><code id="tok">…</code></div>
    </div>
  </section>

  <section class="card stat">
    <h2>概览</h2>
    <div class="grid3">
      <div><span class="num" id="numCount">–</span><span class="lbl">已收文件</span></div>
      <div><span class="num" id="numBytes">–</span><span class="lbl">总大小</span></div>
      <div><span class="num" id="numLast">–</span><span class="lbl">最后同步</span></div>
    </div>
    <div class="row"><span>接收目录</span><code id="dir">…</code><button class="mini" id="chgdir" title="更换存储位置">更改</button></div>
    <div class="actions">
      <button id="open">打开文件夹</button>
      <button class="ghost" id="refresh">刷新</button>
      <button class="danger" id="quit">退出程序</button>
    </div>
    <p class="hint" style="margin:12px 0 0">关掉这个网页不会停止同步。要彻底停止，点「退出程序」。</p>
  </section>

  <section class="card up">
    <h2>上传文件</h2>
    <p class="hint">不装 App 也能用：在这里直接选照片、视频或任意文件</p>
    <label class="drop" id="drop">
      <input type="file" id="file" multiple hidden>
      <span>点击选择文件</span>
      <span class="sub">也可以把文件拖到这里</span>
    </label>
    <ul id="queue"></ul>
  </section>

  <section class="card list">
    <div class="lhead"><h2>已接收文件</h2><span class="muted" id="tip"></span></div>
    <div id="files"><div class="empty">还没有收到文件</div></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="mbox">
    <h3 id="mtitle"></h3>
    <p id="mtext"></p>
    <code id="mpath" hidden></code>
    <input id="minput" hidden spellcheck="false" autocomplete="off">
    <div class="mbtns" id="mbtns"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let info = null;

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function human(b){
  if (b < 1024) return b + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < 3);
  return b.toFixed(b >= 100 ? 0 : 1) + ' ' + u[i];
}
function timeAgo(ts){
  if (!ts) return '–';
  const d = Date.now()/1000 - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60) + ' 分钟前';
  if (d < 86400) return Math.floor(d/3600) + ' 小时前';
  if (d < 86400*7) return Math.floor(d/86400) + ' 天前';
  const t = new Date(ts*1000);
  return (t.getMonth()+1) + '-' + String(t.getDate()).padStart(2,'0');
}
function shortTime(ts){
  const t = new Date(ts*1000), now = new Date();
  const same = t.toDateString() === now.toDateString();
  const hm = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  return same ? hm : (t.getMonth()+1) + '/' + t.getDate() + ' ' + hm;
}
const EXT_COLOR = {
  jpg:'#3b82f6', jpeg:'#3b82f6', png:'#3b82f6', heic:'#3b82f6', webp:'#3b82f6', gif:'#3b82f6',
  mp4:'#8b5cf6', mov:'#8b5cf6', mkv:'#8b5cf6', avi:'#8b5cf6', '3gp':'#8b5cf6',
  pdf:'#e5484d', doc:'#2563eb', docx:'#2563eb', xls:'#0ea371', xlsx:'#0ea371', ppt:'#f97316', pptx:'#f97316',
  zip:'#a16207', rar:'#a16207', '7z':'#a16207', apk:'#0ea371', mp3:'#ec4899', wav:'#ec4899'
};

async function loadInfo(){
  try{
    const r = await fetch('/api/info'); const j = await r.json();
    if(!j.ok) throw 0;
    info = j;
    $('#status').textContent = '运行中 · 端口 ' + j.port;
    $('#status').classList.remove('off');
    $('#url').textContent = j.url;
    $('#dav').textContent = j.dav;
    $('#tok').textContent = j.token;
    $('#dir').textContent = j.dir;
    $('#qr').src = '/qr.png?ip=' + encodeURIComponent(j.host) + '&v=' + Date.now();
    renderIPs(j);
  }catch(e){
    $('#status').textContent = '未连接';
    $('#status').classList.add('off');
  }
}

// 电脑同时连着路由器、手机热点、虚拟机网卡时，二维码里的地址可能不是手机能到的那一个。
// 把候选地址都列出来，点一下就能换二维码。
function renderIPs(j){
  const list = (j.ips || []).filter(x => x && x.ip);
  if(list.length < 2){ $('#ipsel').hidden = true; return; }
  $('#ipsel').hidden = false;
  $('#ipbtns').innerHTML = list.map(x =>
    '<button data-ip="' + esc(x.ip) + '"' + (x.ip === j.host ? ' class="on"' : '') + '>' +
      esc(x.ip) + (x.note ? '<em>' + esc(x.note) + '</em>' : '') +
    '</button>'
  ).join('');
  $('#ipbtns').querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      const ip = btn.dataset.ip;
      $('#qr').src = '/qr.png?ip=' + encodeURIComponent(ip) + '&v=' + Date.now();
      $('#url').textContent = 'http://' + ip + ':' + j.port;
      $('#dav').textContent = 'http://' + ip + ':' + j.port + '/dav';
      $('#ipbtns').querySelectorAll('button').forEach(o => o.classList.toggle('on', o === btn));
    };
  });
}

async function loadList(){
  try{
    const r = await fetch('/api/list?limit=200'); const j = await r.json();
    if(!j.ok) return;
    $('#numCount').textContent = j.count;
    $('#numBytes').textContent = human(j.bytes);
    $('#numLast').textContent = j.last ? timeAgo(j.last) : '–';
    $('#tip').textContent = j.total ? ('共 ' + j.total + ' 个，显示最近 ' + j.files.length + ' 个') : '';
    if(!j.files.length){
      $('#files').innerHTML = '<div class="empty">还没有收到文件，用手机扫码传一个试试</div>';
      return;
    }
    $('#files').innerHTML = j.files.map(f => {
      const name = f.path.split('/').pop();
      const ext = (name.split('.').pop() || '?').toUpperCase().slice(0,4);
      const color = EXT_COLOR[ext.toLowerCase()] || '#94a3b8';
      return '<div class="frow">' +
        '<span class="ext" style="background:' + color + '">' + esc(ext) + '</span>' +
        '<div class="fname"><b title="' + esc(name) + '">' + esc(name) + '</b>' +
        '<span title="' + esc(f.path) + '">' + esc(f.path) + '</span></div>' +
        '<span class="fsize">' + human(f.size) + '</span>' +
        '<span class="ftime">' + shortTime(f.mtime) + '</span>' +
        '<button class="del" data-p="' + esc(f.path) + '" title="删除">✕</button>' +
        '</div>';
    }).join('');
  }catch(e){ /* 忽略瞬时失败 */ }
}

function addQueueItem(name){
  const li = document.createElement('li');
  li.innerHTML = '<span class="qname" title="' + esc(name) + '" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(name) + '</span>' +
    '<div class="bar"><i></i></div><span class="pct">0%</span>';
  $('#queue').appendChild(li);
  return li;
}

function uploadOne(file){
  return new Promise(resolve => {
    const li = addQueueItem(file.name);
    const bar = li.querySelector('.bar i');
    const pct = li.querySelector('.pct');
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', '/api/put?path=' + encodeURIComponent(file.name), true);
    xhr.setRequestHeader('X-Mtime', Math.floor(file.lastModified / 1000));
    xhr.upload.onprogress = e => {
      if(e.lengthComputable){
        const p = Math.round(e.loaded / e.total * 100);
        bar.style.width = p + '%'; pct.textContent = p + '%';
      }
    };
    xhr.onload = () => {
      if(xhr.status === 200){ li.classList.add('done'); bar.style.width='100%'; pct.textContent = '完成'; }
      else { pct.textContent = '失败'; pct.style.color = 'var(--danger)'; }
      resolve();
    };
    xhr.onerror = () => { pct.textContent = '失败'; resolve(); };
    xhr.send(file);
  });
}

async function doUpload(files){
  if(!files || !files.length) return;
  for(const f of files) await uploadOne(f);
  loadList();
  setTimeout(loadList, 1200);
}

$('#file').addEventListener('change', e => { doUpload([...e.target.files]); e.target.value=''; });
['dragenter','dragover'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.remove('over'); }));
$('#drop').addEventListener('drop', e => doUpload([...e.dataTransfer.files]));

$('#files').addEventListener('click', async e => {
  const b = e.target.closest('.del'); if(!b) return;
  if(!confirm('确定从电脑上删除这个文件？')) return;
  await fetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path: b.dataset.p})});
  loadList();
});
// ---------------------------------------------------------------- 弹层与提示

function openModal(opt){
  return new Promise(resolve => {
    const m = $('#modal'), p = $('#mpath'), ip = $('#minput'), btns = $('#mbtns');
    $('#mtitle').textContent = opt.title || '';
    $('#mtext').textContent = opt.text || '';
    p.hidden = !opt.path; p.textContent = opt.path || '';
    ip.hidden = !opt.input;
    if(opt.input){ ip.value = opt.inputValue || ''; ip.placeholder = opt.placeholder || ''; }
    btns.innerHTML = '';
    (opt.buttons || [{text:'好', value:true, cls:'primary'}]).forEach(b => {
      const el = document.createElement('button');
      el.textContent = b.text;
      if(b.cls) el.className = b.cls;
      el.onclick = () => { done({act: b.value, input: ip.value.trim()}); };
      btns.appendChild(el);
    });
    function done(res){ m.hidden = true; document.removeEventListener('keydown', onKey); resolve(res); }
    function onKey(e){ if(e.key === 'Escape') done({act: null}); }
    document.addEventListener('keydown', onKey);
    m.onclick = e => { if(e.target === m) done({act: null}); };
    m.hidden = false;
    if(opt.input) setTimeout(() => { ip.focus(); ip.select(); }, 60);
  });
}

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 4000);
}

// ---------------------------------------------------------------- 更换接收目录

// pickDirPath 先试系统选择框；调不出来（非 Windows 或 PowerShell 缺失）就让人手填。
async function pickDirPath(){
  try{
    const r = await fetch('/api/pickdir', {method:'POST'});
    const j = await r.json();
    if(j.ok) return j.dir;
    if(!j.unsupported) return ''; // 用户点了取消
  }catch(e){
    /* 落到手动输入 */
  }
  const ans = await openModal({
    title: '输入新的接收目录',
    text: '位置不存在会自动创建。也可以写 D:\\手机备份 或 ~/备份。',
    input: true,
    inputValue: (info && info.dir) || '',
    placeholder: 'D:\\手机备份',
    buttons: [
      {text:'取消', value:null, cls:'ghost'},
      {text:'下一步', value:'go', cls:'primary'}
    ]
  });
  return ans.act === 'go' ? ans.input : '';
}

async function doSwitch(dir){
  const hasFiles = info && info.count > 0;
  let move = false;
  if(hasFiles){
    const ans = await openModal({
      title: '已有文件要不要一起搬过去？',
      text: '当前目录里有 ' + info.count + ' 个文件，共 ' + human(info.bytes) + '。' +
            '一起搬过去，新位置就是完整的一份；选择「只换位置」的话，这些文件会留在原处。',
      path: dir,
      buttons: [
        {text:'取消', value:null, cls:'ghost'},
        {text:'只换位置', value:'keep'},
        {text:'一起搬过去', value:'move', cls:'primary'}
      ]
    });
    if(!ans.act) return;
    move = ans.act === 'move';
  }

  const btn = $('#chgdir');
  const old = btn.textContent;
  btn.textContent = move ? '搬移中' : '切换中';
  if(move) toast('正在搬移文件，文件多的话需要一会儿，请不要关闭页面');
  try{
    const r = await fetch('/api/setdir', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({dir: dir, move: move})
    });
    const j = await r.json();
    if(!j.ok){ toast(j.error || '切换失败'); return; }
    if(j.unchanged){ toast('已经在这个目录了'); return; }
    if(move){
      toast(j.moved ? ('已搬到新位置：' + j.moved + ' 个文件 · ' + human(j.bytes)) : '目录已切换，没有需要搬的文件');
    }else{
      toast('已切换到新位置，旧目录里的文件留在原处');
    }
    loadInfo(); loadList();
  }catch(e){
    toast('切换失败，请确认电脑端还在运行');
  }finally{
    btn.textContent = old;
  }
}

$('#chgdir').addEventListener('click', async () => {
  const btn = $('#chgdir');
  if(btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '处理中';
  try{
    const dir = await pickDirPath();
    if(dir) await doSwitch(dir);
  }finally{
    btn.disabled = false;
    btn.textContent = '更改';
  }
});

$('#open').addEventListener('click', () => fetch('/api/open', {method:'POST'}));
$('#refresh').addEventListener('click', () => { loadInfo(); loadList(); });
$('#quit').addEventListener('click', async () => {
  if(!confirm('退出后手机将无法连接，确定？')) return;
  await fetch('/api/quit', {method:'POST'});
  document.body.innerHTML = '<div style="padding:80px 24px;text-align:center;font-size:15px;color:#78808f">LanSync 已停止，可以关闭此页面了。</div>';
});
$('#copy').addEventListener('click', async () => {
  const t = $('#url').textContent;
  try{ await navigator.clipboard.writeText(t); $('#copy').textContent = '已复制'; }
  catch(e){ $('#copy').textContent = '长按复制'; }
  setTimeout(() => $('#copy').textContent = '复制', 1500);
});

loadInfo(); loadList();
setInterval(loadList, 4000);
